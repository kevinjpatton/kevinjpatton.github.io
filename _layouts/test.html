<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Dynamic Title (Falls back to default if not specified in the page's front matter) -->
    <title>{{ page.title | default: "Dr. Kevin Patton | Philosopher & Educator" }}</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Your Custom Stylesheet -->
    <link rel="stylesheet" href="/style.css">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS (CDN for development, compile for production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        body { -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 selection:bg-blue-200 selection:text-blue-900 flex flex-col">

    <!-- ==========================================
         NAVIGATION
         ========================================== -->
    <nav id="navbar" class="fixed w-full z-50 transition-all duration-300 bg-transparent py-5">
        <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
            <a href="/" class="font-bold text-xl tracking-tight text-slate-900 hover:text-blue-600 transition-colors">
                Dr. Kevin Patton
            </a>
            
            <!-- Desktop Nav -->
            <div class="hidden md:flex space-x-8">
                <a href="/" class="text-sm font-medium {% if page.url == '/' %}text-blue-600 border-b-2 border-blue-600 pb-1{% else %}text-slate-600 hover:text-blue-600 transition-colors{% endif %}">Home</a>
                <a href="/cv" class="text-sm font-medium {% if page.url == '/about' %}text-blue-600 border-b-2 border-blue-600 pb-1{% else %}text-slate-600 hover:text-blue-600 transition-colors{% endif %}">CV</a>
                <a href="/teaching" class="text-sm font-medium {% if page.url == '/teaching' %}text-blue-600 border-b-2 border-blue-600 pb-1{% else %}text-slate-600 hover:text-blue-600 transition-colors{% endif %}">Teaching</a>
                <a href="/podcasts" class="text-sm font-medium {% if page.url == '/podcasts' %}text-blue-600 border-b-2 border-blue-600 pb-1{% else %}text-slate-600 hover:text-blue-600 transition-colors{% endif %}">Podcasts</a>
                <a href="/research" class="text-sm font-medium {% if page.url == '/research' %}text-blue-600 border-b-2 border-blue-600 pb-1{% else %}text-slate-600 hover:text-blue-600 transition-colors{% endif %}">Research</a>
                <a href="/contact" class="text-sm font-medium {% if page.url == '/contact' %}text-blue-600 border-b-2 border-blue-600 pb-1{% else %}text-slate-600 hover:text-blue-600 transition-colors{% endif %}">Contact</a>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button id="mobile-menu-btn" class="md:hidden text-slate-600 hover:text-slate-900 focus:outline-none">
                <i class="ph ph-list text-2xl"></i>
            </button>
        </div>

        <!-- Mobile Nav Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-white shadow-lg border-t border-slate-100 py-4 flex-col space-y-4 px-6">
            <a href="/" class="text-left text-base font-medium {% if page.url == '/' %}text-blue-600{% else %}text-slate-700 hover:text-blue-600{% endif %}">Home</a>
            <a href="/cv" class="text-left text-base font-medium {% if page.url == '/cv' %}text-blue-600{% else %}text-slate-700 hover:text-blue-600{% endif %}">CV</a>
            <a href="/teaching" class="text-left text-base font-medium {% if page.url == '/teaching' %}text-blue-600{% else %}text-slate-700 hover:text-blue-600{% endif %}">Teaching</a>
            <a href="/podcasts" class="text-left text-base font-medium {% if page.url == '/podcasts' %}text-blue-600{% else %}text-slate-700 hover:text-blue-600{% endif %}">Podcasts</a>
            <a href="/research" class="text-left text-base font-medium {% if page.url == '/research' %}text-blue-600{% else %}text-slate-700 hover:text-blue-600{% endif %}">Research</a>
            <a href="/contact" class="text-left text-base font-medium {% if page.url == '/contact' %}text-blue-600{% else %}text-slate-700 hover:text-blue-600{% endif %}">Contact</a>
        </div>
    </nav>

    <!-- ==========================================
         PAGE CONTENT INJECTION
         ========================================== -->
    <div id="page-container" class="flex-grow flex flex-col">
        {{ content }}
    </div>

    <!-- ==========================================
         FOOTER
         ========================================== -->
    <footer class="bg-slate-950 text-slate-400 py-12 px-6 border-t border-slate-900 mt-auto">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <div class="font-bold text-white mb-2">Dr. Kevin Patton</div>
                <p class="text-sm">University of Nebraska - Omaha</p>
            </div>
            <div class="text-center md:text-right">
                <p class="text-sm">© <script>document.write(new Date().getFullYear())</script> Kevin Patton. All rights reserved.</p>
                <p class="text-sm mt-1">Based in Omaha, Nebraska.</p>
            </div>
        </div>
    </footer>

    <!-- ==========================================
         INTERACTIVE SCRIPTS
         ========================================== -->
    <script>
        // Navbar Scroll Effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 20) {
                navbar.classList.remove('bg-transparent', 'py-5');
                navbar.classList.add('bg-white', 'shadow-sm', 'py-3');
            } else {
                navbar.classList.add('bg-transparent', 'py-5');
                navbar.classList.remove('bg-white', 'shadow-sm', 'py-3');
            }
        });

        // Mobile Menu Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const icon = mobileMenuBtn.querySelector('i');

        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            mobileMenu.classList.toggle('flex');
            
            if (mobileMenu.classList.contains('hidden')) {
                icon.classList.replace('ph-x', 'ph-list');
            } else {
                icon.classList.replace('ph-list', 'ph-x');
            }
        });
    </script>
</body>
</html>
